<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Bill Capture - Smart Shopping Tracker</title>

  <!-- PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BillCapture">
  <meta name="mobile-web-app-capable" content="yes">
  
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      margin: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior-y: contain;
    }
    #root {
      min-height: 100vh;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    .initial-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .initial-logo {
      font-size: 3rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.05em;
      line-height: 1;
      margin-bottom: 0.5rem;
    }
    .initial-sub {
      font-size: 10px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.4em;
      color: #2563eb;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@neondatabase/serverless": "https://esm.sh/@neondatabase/serverless@^1.0.2",
    "uuid": "https://esm.sh/uuid@^13.0.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>
<body>
  <div id="root">
    <div class="initial-loader">
      <div class="initial-logo">BILL CAPTURE</div>
      <div class="initial-sub">Private Cloud Storage</div>
    </div>
  </div>
  
  <script type="module" src="index.tsx"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Menggunakan path relatif sederhana 'sw.js'. 
        // Browser akan otomatis menangani origin dan scope berdasarkan lokasi file ini.
        navigator.serviceWorker.register('sw.js')
          .then(reg => {
            console.log('Service Worker terdaftar:', reg.scope);
            reg.update();
          })
          .catch(err => {
            console.error('Pendaftaran Service Worker gagal:', err);
          });
      });
    }
  </script>
</body>
</html>
